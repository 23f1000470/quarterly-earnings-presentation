name: Deploy static content to Pages (debug)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo info (debug)
        run: |
          echo "== Current branch =="
          git branch --show-current || true
          echo "== Last commits =="
          git --no-pager log -n 5 --oneline || true
          echo "== Files at repo root (top 200 lines) =="
          ls -la | sed -n '1,200p' || true

      - name: Show size of content (debug)
        run: |
          du -sh . || true
          echo "== List important files =="
          test -f index.html && echo "index.html FOUND" || echo "index.html MISSING"
          test -d docs && echo "docs/ folder FOUND" || echo "docs/ folder not present"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (debug)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
